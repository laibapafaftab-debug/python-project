<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator — Laiba Aftab</title>
<meta name="description" content="A browser calculator rebuilt from a Python command-line script, by Laiba Aftab. Plain HTML, CSS and JavaScript — no libraries.">

<!-- Open Graph -->
<meta property="og:title" content="Calculator — Laiba Aftab">
<meta property="og:description" content="A Python command-line calculator, rebuilt for the browser. Plain HTML, CSS and JavaScript — no libraries.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://laibapafaftab-debug.github.io/python-project/">

<!-- Favicon -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%230F1115%22/><text x=%2250%22 y=%2268%22 font-size=%2258%22 text-anchor=%22middle%22 fill=%22%232DD4BF%22 font-family=%22monospace%22>÷</text></svg>">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #F5F6F8;
    --surface: #FFFFFF;
    --surface-2: #ECEEF2;
    --text: #14181F;
    --text-dim: #5B6472;
    --accent: #0E9488;
    --accent-text: #FFFFFF;
    --op: #14181F;
    --op-bg: #E7E9ED;
    --border: #DCE0E6;
    --danger: #C4452E;
    --shadow: 0 20px 50px -20px rgba(16, 20, 28, 0.25);
  }

  [data-theme="dark"] {
    --bg: #0F1115;
    --surface: #171A20;
    --surface-2: #1F232B;
    --text: #EDEFF3;
    --text-dim: #8A93A3;
    --accent: #2DD4BF;
    --accent-text: #0A1613;
    --op: #2DD4BF;
    --op-bg: #202831;
    --border: #2A2F38;
    --danger: #F2795B;
    --shadow: 0 20px 60px -20px rgba(0, 0, 0, 0.6);
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 32px 20px 48px;
    transition: background 0.3s ease, color 0.3s ease;
  }

  .wrap {
    width: 100%;
    max-width: 380px;
  }

  header.page-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 28px;
  }

  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    color: var(--text-dim);
    letter-spacing: 0.02em;
    margin: 0 0 6px;
  }

  h1 {
    font-size: 22px;
    font-weight: 600;
    line-height: 1.3;
    margin: 0;
    max-width: 280px;
  }

  .theme-toggle {
    flex-shrink: 0;
    width: 44px;
    height: 44px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: border-color 0.2s ease, transform 0.15s ease, background 0.3s ease;
  }

  .theme-toggle:hover {
    border-color: var(--accent);
    transform: translateY(-1px);
  }

  .theme-toggle:active {
    transform: translateY(0);
  }

  .theme-toggle svg {
    width: 20px;
    height: 20px;
  }

  .calc {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 20px;
    box-shadow: var(--shadow);
    transition: background 0.3s ease, border-color 0.3s ease;
  }

  .display {
    background: var(--surface-2);
    border-radius: 16px;
    padding: 28px 18px 18px;
    margin-bottom: 16px;
    text-align: right;
    min-height: 96px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    overflow: hidden;
    transition: background 0.3s ease;
  }

  .display .history {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--text-dim);
    min-height: 16px;
    margin-bottom: 6px;
    white-space: nowrap;
    overflow-x: auto;
  }

  .display .current {
    font-size: 38px;
    font-weight: 500;
    line-height: 1.1;
    word-break: break-all;
    font-variant-numeric: tabular-nums;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }

  button.key {
    appearance: none;
    border: none;
    border-radius: 14px;
    height: 60px;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 19px;
    font-weight: 500;
    color: var(--text);
    background: var(--surface-2);
    cursor: pointer;
    transition: transform 0.08s ease, background 0.15s ease, box-shadow 0.15s ease;
  }

  button.key:hover {
    background: var(--border);
  }

  button.key:active {
    transform: scale(0.95);
  }

  button.key:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  button.key.op {
    background: var(--op-bg);
    color: var(--op);
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
  }

  button.key.func {
    color: var(--danger);
    font-size: 16px;
  }

  button.key.equals {
    background: var(--accent);
    color: var(--accent-text);
    grid-row: span 1;
  }

  button.key.equals:hover {
    filter: brightness(1.08);
  }

  button.key.zero {
    grid-column: span 2;
    text-align: left;
    padding-left: 26px;
  }

  footer.page-foot {
    margin-top: 22px;
    text-align: center;
  }

  footer.page-foot p {
    font-size: 13.5px;
    color: var(--text-dim);
    line-height: 1.6;
    margin: 0;
  }

  footer.page-foot a {
    color: var(--accent);
    text-decoration: none;
    border-bottom: 1px solid transparent;
    transition: border-color 0.2s ease;
  }

  footer.page-foot a:hover {
    border-bottom-color: var(--accent);
  }

  @media (max-width: 400px) {
    h1 { font-size: 19px; }
    .display .current { font-size: 32px; }
    button.key { height: 54px; font-size: 17px; }
  }
</style>
</head>
<body data-theme="dark">

<div class="wrap">
  <header class="page-head">
    <div>
      <p class="eyebrow">Python project · rebuilt for the browser</p>
      <h1>A calculator, originally written as a command-line script.</h1>
    </div>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark and light mode" title="Toggle theme">
      <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
    </button>
  </header>

  <div class="calc">
    <div class="display">
      <div class="history" id="history">&nbsp;</div>
      <div class="current" id="current">0</div>
    </div>

    <div class="grid">
      <button class="key func" data-action="clear">C</button>
      <button class="key func" data-action="sign">±</button>
      <button class="key func" data-action="percent">%</button>
      <button class="key op" data-action="op" data-value="÷">÷</button>

      <button class="key" data-action="num" data-value="7">7</button>
      <button class="key" data-action="num" data-value="8">8</button>
      <button class="key" data-action="num" data-value="9">9</button>
      <button class="key op" data-action="op" data-value="×">×</button>

      <button class="key" data-action="num" data-value="4">4</button>
      <button class="key" data-action="num" data-value="5">5</button>
      <button class="key" data-action="num" data-value="6">6</button>
      <button class="key op" data-action="op" data-value="−">−</button>

      <button class="key" data-action="num" data-value="1">1</button>
      <button class="key" data-action="num" data-value="2">2</button>
      <button class="key" data-action="num" data-value="3">3</button>
      <button class="key op" data-action="op" data-value="+">+</button>

      <button class="key zero" data-action="num" data-value="0">0</button>
      <button class="key" data-action="decimal">.</button>
      <button class="key equals" data-action="equals">=</button>
    </div>
  </div>

  <footer class="page-foot">
    <p>
      Built with plain HTML, CSS and JavaScript — no libraries.<br>
      <a href="https://laibapafaftab-debug.github.io/python-project/calculator.py" target="_blank" rel="noopener">View the original Python script →</a>
    </p>
  </footer>
</div>

<script>
  // ---------- Theme ----------
  const root = document.body;
  const toggle = document.getElementById('themeToggle');
  const icon = document.getElementById('themeIcon');

  const sunPath = '<circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>';
  const moonPath = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>';

  function applyTheme(theme) {
    root.setAttribute('data-theme', theme);
    icon.innerHTML = theme === 'dark' ? sunPath : moonPath;
    try { localStorage.setItem('calc-theme', theme); } catch (e) {}
  }

  let saved = 'dark';
  try { saved = localStorage.getItem('calc-theme') || 'dark'; } catch (e) {}
  applyTheme(saved);

  toggle.addEventListener('click', () => {
    const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    applyTheme(next);
  });

  // ---------- Calculator logic ----------
  const currentEl = document.getElementById('current');
  const historyEl = document.getElementById('history');

  let current = '0';
  let previous = null;
  let operator = null;
  let overwrite = true;

  function render() {
    currentEl.textContent = current;
    historyEl.textContent = (previous !== null && operator) ? `${previous} ${operator}` : '\u00A0';
  }

  function inputNum(n) {
    if (overwrite) {
      current = n;
      overwrite = false;
    } else {
      current = current === '0' ? n : current + n;
    }
    render();
  }

  function inputDecimal() {
    if (overwrite) {
      current = '0.';
      overwrite = false;
      render();
      return;
    }
    if (!current.includes('.')) current += '.';
    render();
  }

  function setOperator(op) {
    if (operator && !overwrite) compute();
    previous = current;
    operator = op;
    overwrite = true;
    render();
  }

  function compute() {
    if (operator === null || previous === null) return;
    const a = parseFloat(previous);
    const b = parseFloat(current);
    let result;
    switch (operator) {
      case '+': result = a + b; break;
      case '−': result = a - b; break;
      case '×': result = a * b; break;
      case '÷': result = b === 0 ? 'Error' : a / b; break;
      default: return;
    }
    current = typeof result === 'number' ? trim(result) : result;
    operator = null;
    previous = null;
    overwrite = true;
    render();
  }

  function trim(n) {
    if (!isFinite(n)) return 'Error';
    return parseFloat(n.toFixed(10)).toString();
  }

  function clearAll() {
    current = '0';
    previous = null;
    operator = null;
    overwrite = true;
    render();
  }

  function toggleSign() {
    if (current === '0') return;
    current = current.startsWith('-') ? current.slice(1) : '-' + current;
    render();
  }

  function percent() {
    current = trim(parseFloat(current) / 100);
    render();
  }

  document.querySelectorAll('.key').forEach(btn => {
    btn.addEventListener('click', () => {
      const action = btn.dataset.action;
      const value = btn.dataset.value;
      if (action === 'num') inputNum(value);
      else if (action === 'decimal') inputDecimal();
      else if (action === 'op') setOperator(value);
      else if (action === 'equals') compute();
      else if (action === 'clear') clearAll();
      else if (action === 'sign') toggleSign();
      else if (action === 'percent') percent();
    });
  });

  window.addEventListener('keydown', (e) => {
    if (e.key >= '0' && e.key <= '9') inputNum(e.key);
    else if (e.key === '.') inputDecimal();
    else if (e.key === '+') setOperator('+');
    else if (e.key === '-') setOperator('−');
    else if (e.key === '*') setOperator('×');
    else if (e.key === '/') { e.preventDefault(); setOperator('÷'); }
    else if (e.key === 'Enter' || e.key === '=') compute();
    else if (e.key === 'Escape') clearAll();
    else if (e.key === 'Backspace') {
      current = current.length > 1 ? current.slice(0, -1) : '0';
      render();
    }
  });

  render();
</script>

</body>
</html>
